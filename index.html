<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程视频 - 在线课堂</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --card: #ffffff;
            --text: #2c2c2c;
            --text-secondary: #666;
            --accent: #4f6ef7;
            --accent-light: #eef1ff;
            --border: #e5e5e5;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ===== Header ===== */
        .header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }
        .header .logo {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .header .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* ===== Layout ===== */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            gap: 24px;
            min-height: calc(100vh - 73px);
        }

        /* ===== Video List Sidebar ===== */
        .sidebar {
            width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sidebar-header {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 4px 4px;
        }
        .sidebar .count {
            font-weight: 400;
            color: #999;
        }

        .video-item {
            display: flex;
            gap: 12px;
            padding: 12px 14px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.15s ease;
            border: 2px solid transparent;
            background: var(--card);
            user-select: none;
        }
        .video-item:hover {
            background: #fafafa;
            border-color: var(--border);
        }
        .video-item.active {
            background: var(--accent-light);
            border-color: var(--accent);
        }
        .video-item .thumb {
            width: 100px;
            height: 60px;
            border-radius: 6px;
            background: #e8e8e8;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .video-item .thumb .icon {
            font-size: 24px;
            color: #bbb;
        }
        .video-item.active .thumb .icon {
            color: var(--accent);
        }
        .video-item .thumb .duration {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 500;
        }
        .video-item .info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }
        .video-item .info .title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-item .info .meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ===== Main Player Area ===== */
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .player-wrapper {
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .player-wrapper video {
            width: 100%;
            height: 100%;
            outline: none;
        }
        .player-placeholder {
            text-align: center;
            color: #888;
            user-select: none;
        }
        .player-placeholder .big-icon {
            font-size: 64px;
            display: block;
            margin-bottom: 12px;
            opacity: 0.6;
        }
        .player-placeholder p {
            font-size: 15px;
        }

        /* ===== Current Video Info ===== */
        .video-detail {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
        }
        .video-detail h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .video-detail .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .video-detail .tag {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 500;
        }

        /* ===== Empty State ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            color: #aaa;
        }
        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 14px;
            opacity: 0.5;
        }

        /* ===== Responsive ===== */
        @media (max-width: 860px) {
            .container {
                flex-direction: column;
                padding: 12px;
                gap: 12px;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                gap: 8px;
                padding-bottom: 8px;
            }
            .sidebar-header {
                display: none;
            }
            .video-item {
                flex-direction: column;
                min-width: 150px;
                max-width: 180px;
                padding: 10px;
                gap: 8px;
                flex-shrink: 0;
            }
            .video-item .thumb {
                width: 100%;
                height: 90px;
            }
            .video-item .info .title {
                font-size: 13px;
                -webkit-line-clamp: 2;
            }
            .player-wrapper {
                aspect-ratio: 16 / 9;
            }
            .header {
                padding: 12px 16px;
            }
            .header h1 {
                font-size: 16px;
            }
            .video-detail h2 {
                font-size: 17px;
            }
        }
        /* ===== Password Gate ===== */
        .gate-overlay {
            position: fixed;
            inset: 0;
            background: #f0f2f5;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }
        .gate-overlay.hidden { display: none; }
        .gate-card {
            background: #fff;
            border-radius: 14px;
            padding: 40px 36px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .gate-card .icon { font-size: 40px; margin-bottom: 12px; }
        .gate-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .gate-card .hint { font-size: 13px; color: #888; margin-bottom: 20px; }
        .gate-card input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        .gate-card input:focus { border-color: #4f6ef7; }
        .gate-card .error { color: #e53e3e; font-size: 13px; margin-top: 8px; display: none; }

        /* ===== Main content hidden state ===== */
        .main-content.blurred { filter: blur(8px); pointer-events: none; }
    </style>
</head>
<body>

    <!-- Password Gate -->
    <div class="gate-overlay" id="gateOverlay">
        <div class="gate-card">
            <div class="icon">🔐</div>
            <h2>输入密码观看课程</h2>
            <p class="hint">请向老师索取访问密码</p>
            <input type="password" id="gatePassword" placeholder="请输入密码" autofocus>
            <p class="error" id="gateError">密码错误，请重试</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">

    <!-- Header -->
    <header class="header">
        <div class="logo">📺</div>
        <div>
            <h1>在线课堂</h1>
            <div class="subtitle">点击左侧视频开始学习</div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="container">
        <!-- Sidebar: Video List -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                课程列表 <span class="count" id="videoCount"></span>
            </div>
            <div id="videoList"></div>
        </aside>

        <!-- Main: Player + Info -->
        <main class="main">
            <div class="player-wrapper" id="playerWrapper">
                <div class="player-placeholder" id="placeholder">
                    <span class="big-icon">🎬</span>
                    <p>👈 请从左侧选择一节课</p>
                </div>
                <video id="videoPlayer" controls playsinline style="display:none;">
                    你的浏览器不支持视频播放
                </video>
            </div>
            <div class="video-detail" id="videoDetail" style="display:none;">
                <h2 id="currentTitle"></h2>
                <div class="tags" id="currentTags"></div>
            </div>
        </main>
    </div>

    <script src="videos.js"></script>
    <script>
        // ============================================================
        // 下面的代码不需要改动
        // ============================================================
        const videoListEl = document.getElementById('videoList');
        const videoCountEl = document.getElementById('videoCount');
        const videoPlayer = document.getElementById('videoPlayer');
        const placeholder = document.getElementById('placeholder');
        const videoDetail = document.getElementById('videoDetail');
        const currentTitle = document.getElementById('currentTitle');
        const currentTags = document.getElementById('currentTags');

        let currentVideo = null;

        function renderVideoList() {
            const validVideos = COURSE_VIDEOS.filter(v => v.src && v.src.trim());
            videoCountEl.textContent = validVideos.length ? `（共 ${validVideos.length} 节）` : '';

            if (!COURSE_VIDEOS.length) {
                videoListEl.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📭</span>
                        <p>暂无课程视频</p>
                    </div>`;
                return;
            }

            videoListEl.innerHTML = COURSE_VIDEOS.map(v => {
                const hasSrc = v.src && v.src.trim();
                return `
                <div class="video-item${currentVideo && currentVideo.id === v.id ? ' active' : ''}"
                     data-id="${v.id}"
                     ${!hasSrc ? 'style="opacity:0.5;" title="暂未上传视频文件"' : ''}>
                    <div class="thumb">
                        <span class="icon">${hasSrc ? '▶️' : '⏳'}</span>
                        ${v.duration ? `<span class="duration">${v.duration}</span>` : ''}
                    </div>
                    <div class="info">
                        <div class="title">${escapeHtml(v.title)}</div>
                        <div class="meta">${v.date || ''}${!hasSrc ? ' · 待上传' : ''}</div>
                    </div>
                </div>`;
            }).join('');

            // Bind click events
            videoListEl.querySelectorAll('.video-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = item.dataset.id;
                    const video = COURSE_VIDEOS.find(v => v.id === id);
                    if (video && video.src && video.src.trim()) {
                        playVideo(video);
                    }
                });
            });
        }

        function playVideo(video) {
            currentVideo = video;

            // Remove old subtitle tracks
            while (videoPlayer.firstChild) {
                videoPlayer.removeChild(videoPlayer.firstChild);
            }

            // Add subtitle track if available
            if (video.subtitles) {
                const track = document.createElement('track');
                track.kind = 'subtitles';
                track.label = '中英双语';
                track.srclang = 'zh';
                track.src = video.subtitles;
                track.default = true;
                videoPlayer.appendChild(track);
            }

            // Update player
            placeholder.style.display = 'none';
            videoPlayer.style.display = 'block';
            videoPlayer.src = video.src;
            videoPlayer.load();
            videoPlayer.play().catch(() => {});

            // Enable subtitles by default
            videoPlayer.onloadedmetadata = () => {
                if (videoPlayer.textTracks && videoPlayer.textTracks.length > 0) {
                    videoPlayer.textTracks[0].mode = 'showing';
                }
            };

            // Update detail
            videoDetail.style.display = 'block';
            currentTitle.textContent = video.title;
            currentTags.innerHTML = (video.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

            // Update sidebar highlight
            renderVideoList();

            // On mobile, scroll to player
            if (window.innerWidth <= 860) {
                videoPlayer.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        // Password Gate
        // ============================================================
        const gateOverlay = document.getElementById('gateOverlay');
        const gatePassword = document.getElementById('gatePassword');
        const gateError = document.getElementById('gateError');
        const mainContent = document.getElementById('mainContent');

        // Check if already authenticated
        if (localStorage.getItem('_course_auth') === '1') {
            gateOverlay.classList.add('hidden');
        }

        gatePassword.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const input = gatePassword.value.trim();
                if (input === COURSE_PASSWORD) {
                    localStorage.setItem('_course_auth', '1');
                    gateOverlay.classList.add('hidden');
                    gateError.style.display = 'none';
                } else {
                    gateError.style.display = 'block';
                    gatePassword.value = '';
                }
            }
        });

        // Init
        renderVideoList();
    </script>
</body>
</html>
